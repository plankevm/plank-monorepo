name: Test

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Compiler Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plankc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-rust-env
      - run: just test-all

  tree-sitter-test:
    name: Tree-sitter Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plank-tree-sitter
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: tree-sitter-cli
      - run: tree-sitter --version
      - run: tree-sitter generate
      - run: tree-sitter test
