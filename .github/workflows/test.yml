name: Test

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plankc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-rust-env
      - run: just test-all

  tree-sitter-check:
    name: Tree-sitter Generated Files Up-to-date
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plank-tree-sitter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tree-sitter generate
      - name: Check for uncommitted changes
        run: git diff --exit-code -- src/
      - run: npx tree-sitter test
